<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded monochrome tile so icon stays crisp on both dark and light backgrounds -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#141414" stroke="#e6e6e6" stroke-width="2"/>
  <!-- SF-style minimalist classic iPod silhouette -->
  <rect x="19" y="10" width="26" height="44" rx="5" fill="#f5f5f5"/>
  <!-- Screen -->
  <rect x="22.5" y="13.5" width="19" height="14" rx="2" fill="#141414"/>
  <!-- Click wheel ring and center button -->
  <circle cx="32" cy="41.5" r="8.5" fill="none" stroke="#141414" stroke-width="2.2"/>
  <circle cx="32" cy="41.5" r="3.2" fill="#141414"/>
</svg>
